services:
  web:
    build:
      context: ./docker/php
    container_name: harvest-training-web
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ../keiri:/var/www/keiri:ro
    environment:
      DB_HOST: db
      DB_NAME: kanful
      DB_USER: kanful
      DB_PASSWORD: kanful
    depends_on:
      - db

  db:
    image: postgres:9.2
    container_name: harvest-training-db
    environment:
      POSTGRES_DB: kanful
      POSTGRES_USER: kanful
      POSTGRES_PASSWORD: kanful
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - training-pg-data:/var/lib/postgresql/data

volumes:
  training-pg-data:
